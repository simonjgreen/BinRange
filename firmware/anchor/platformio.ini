; BinRange anchor — responder, publishes per-tag ranging to MQTT.
;
; Note: esp32 settings live in their own section rather than [env], because
; the native test environment must not inherit `board` or `framework`.
[esp32]
platform = espressif32@6.5.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@2.5.1
extra_scripts =
    pre:../../scripts/anchor_admin_pio.py
    pre:../../scripts/anchor_identity_pio.py
    pre:../../scripts/anchor_web_build.py
    post:../../scripts/anchor_ble_build.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=0
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DCONFIG_BT_NIMBLE_MAX_BONDS=16
    ; CSFC records persist per bonded peer, not per simultaneous connection.
    -DMYNEWT_VAL_BLE_STORE_MAX_CSFCS=CONFIG_BT_NIMBLE_MAX_BONDS
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DMQTT_MAX_PACKET_SIZE=2048

[env:anchor]
extends = esp32

[env:ota]
extends = esp32
upload_protocol = espota
upload_port = uwb-a.local
; OTA now uses the private admin credential. Prefer the authenticated web UI;
; do not restore the retired test password or commit an upload password here.

; Host-side tests for the Arduino-free core modules.
[env:native]
platform = native
build_src_filter = +<core/>
build_flags =
    -std=gnu++17
    -I src
    -I test/test_admin_runtime/stubs
test_framework = unity
; This directory only holds NVS stubs for test_anchor_identity_runtime.py.
test_ignore = test_update_identity
; Project sources are not compiled into tests unless this is set.
test_build_src = yes
