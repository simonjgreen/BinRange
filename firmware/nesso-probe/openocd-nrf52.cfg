# Pass -c 'set PROBE_IP 192.168.x.x' before loading this file.
if {![info exists PROBE_IP]} {
    error "Set PROBE_IP to the Nesso's address first"
}
bindto 127.0.0.1
adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host $PROBE_IP
cmsis-dap tcp port 4441
transport select swd
source [find target/nordic/nrf52.cfg]
# Target defaults set their own speed, so override AFTER sourcing the target.
adapter speed 100
reset_config none
# Loading this configuration does not issue reset, program, recover or erase.
