; BinRange tag emulator — board B pretends to be a bin tag.
; DS-TWR initiator: wakes, runs a burst of exchanges, sleeps.
[env]
lib_extra_dirs = ../shared
platform = espressif32@6.5.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

; Wired flashing — first time, and for recovery:
;   pio run -e uwb -t upload --upload-port /dev/ttyUSB0
[env:uwb]

; Over the air, once a board is on Wi-Fi:
;   pio run -e ota -t upload --upload-port uwb-b.local
;   pio run -e ota -t upload --upload-port uwb-b.local
[env:ota]
upload_protocol = espota
upload_port = uwb-b.local
; Supply your private OTA authentication explicitly; never commit it here.

; Control build with networking compiled out, used to test whether Wi-Fi
; disturbs the ranging measurements. Logs every sample to serial.
[env:nowifi]
build_flags = ${env.build_flags} -DNO_WIFI
